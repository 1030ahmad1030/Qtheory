[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QSignature"
version = "1.0.0"
description = "Model-free dynamical regime classification for causal time series data"
readme = "README.md"
license = {text = "MIT License"}
authors = [
    {name = "Ahmad Muhammad", email = "ahmadmuhammad325@gmail.com"},
    {name = "Salim Jibrin Danbatta", email = "salimdambatta@gmail.com"},
    {name = "Muhammad Abubakar Isah", email = "maisah@ticaret.edu.tr"},
    {name = "Ibrahim Yahaya Muhammad", email = "ibrahimyahayamuhammad@gmail.com"},
    {name = "Sulaiman Sulaiman Ahmad", email = "Sulaiman365@gmail.com"},
    {name = "Abdelrahman Ghozlan", email = "aamghuzlan@gmail.com"},
    {name = "Ahmet Sait AlAli", email = "saitnuclear@gmail.com"},
]
maintainers = [
    {name = "Ahmad Muhammad", email = "ahmadmuhammad325@gmail.com"},
    {name = "Salim Jibrin Danbatta", email = "salimdambatta@gmail.com"},
]
keywords = [
    "signal-processing", "time-series", "dynamical-systems", 
    "classification", "centroid", "envelope", "lambda", "qspace",
    "causal-inference", "system-identification"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
]

[project.urls]
"Homepage" = "https://github.com/1030ahmad1030/QSignature"
"Repository" = "https://github.com/1030ahmad1030/QSignature"
"Paper (Theorems)" = "https://www.researchsquare.com/article/rs-8916580/v1"
"Paper (ISDFS 2026)" = "https://ieeexplore.ieee.org/document/11459049"

[tool.setuptools.packages.find]
include = ["."]
